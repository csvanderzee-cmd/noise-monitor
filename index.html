function drawSpace(g, rand) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#070617');
  sky.addColorStop(1, '#1a0f3d');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // Soft nebula clouds
  [[0.3, 0.35, 'rgba(255,100,200,0.13)'], [0.6, 0.55, 'rgba(90,140,255,0.13)'], [0.45, 0.2, 'rgba(160,90,255,0.12)']].forEach(([fx, fy, color]) => {
    const x = W * fx, y = H * fy, r = Math.max(W, H) * 0.35;
    const neb = g.createRadialGradient(x, y, 0, x, y, r);
    neb.addColorStop(0, color);
    neb.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = neb;
    g.fillRect(0, 0, W, H);
  });

  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.6})`;
    g.beginPath();
    g.arc(rand() * W, rand() * H, rand() * 1.3 + 0.3, 0, Math.PI * 2);
    g.fill();
  }

  const sc = Math.min(W, H) / 700;
  // Ringed planet
  const px = W * 0.8, py = H * 0.24, pr = 55 * sc;
  g.strokeStyle = 'rgba(245,214,155,0.8)';
  g.lineWidth = 7 * sc;
  g.beginPath(); g.ellipse(px, py, pr * 1.8, pr * 0.45, -0.3, Math.PI, Math.PI * 2); g.stroke();
  const pg = g.createRadialGradient(px - pr * 0.3, py - pr * 0.3, pr * 0.1, px, py, pr);
  pg.addColorStop(0, '#ffd6a0');
  pg.addColorStop(1, '#d9825a');
  g.fillStyle = pg;
  g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(px, py, pr * 1.8, pr * 0.45, -0.3, 0, Math.PI); g.stroke();

  // Little moon
  g.fillStyle = '#c9c6d6';
  g.beginPath(); g.arc(W * 0.14, H * 0.16, 22 * sc, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(120,115,140,0.5)';
  [[-0.3, -0.2, 0.25], [0.3, 0.2, 0.2], [0.05, 0.35, 0.12]].forEach(([x, y, r]) => {
    g.beginPath(); g.arc(W * 0.14 + x * 22 * sc, H * 0.16 + y * 22 * sc, r * 22 * sc, 0, Math.PI * 2); g.fill();
  });

  // Big blue planet rising along the bottom
  const ex = W * 0.5, er = Math.max(W, H) * 0.9, ey = H + er * 0.88;
  const eg = g.createRadialGradient(ex, ey - er, er * 0.1, ex, ey, er);
  eg.addColorStop(0, '#5aa9ff');
  eg.addColorStop(1, '#1f4fa8');
  g.fillStyle = eg;
  g.beginPath(); g.arc(ex, ey, er, 0, Math.PI * 2); g.fill();
  // Continents, kept inside the planet's edge
  g.save();
  g.clip();
  g.fillStyle = 'rgba(110,200,120,0.75)';
  [[-0.25, 0.02, 0.12], [0.1, 0.035, 0.08], [0.32, 0.015, 0.1]].forEach(([fx, fy, fr]) => {
    g.beginPath();
    g.ellipse(ex + fx * W, ey - er + fy * H + er * fr * 0.3, er * fr, er * fr * 0.25, 0, 0, Math.PI * 2);
    g.fill();
  });
  g.restore();
  g.strokeStyle = 'rgba(150,210,255,0.5)';
  g.lineWidth = 6;
  g.beginPath(); g.arc(ex, ey, er + 3, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
}

// Twinkling stars and an occasional shooting star
function spaceAmbient(t) {
  for (let i = 0; i < 30; i++) {
    const a = 0.5 + 0.5 * Math.sin(t * (1.5 + i % 4) + i);
    ctx.fillStyle = `rgba(255,255,230,${a})`;
    const x = (i * 397.1) % W, y = (i * 211.7) % (H * 0.75);
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  const cycle = 7, n = Math.floor(t / cycle), p = (t % cycle) / 1.2;
  if (p < 1) {
    const x0 = ((n * 373) % 70 + 10) / 100 * W, y0 = ((n * 197) % 30 + 5) / 100 * H;
    const x = x0 + p * 300, y = y0 + p * 150;
    const grad = ctx.createLinearGradient(x - 90, y - 45, x, y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${1 - p})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x - 90, y - 45); ctx.lineTo(x, y); ctx.stroke();
  }
}

// ---- Critter drawing ----
// Cycles through the hues for rainbow rares
function rainbow(t) {
  const h = (t * 0.4) % 1;
  const f = n => { const k = (n + h * 12) % 12; return Math.round(255 * (0.5 - 0.5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}

// Shared cute face, drawn around (ox, oy) in body-size units.
// Moods: happy, worried (close to the line), sad (yellow warning), scared (fleeing)
function drawFace(k, s, t, ox = 0, oy = 0) {
  const scared = k.mood === 'scared', sad = k.mood === 'sad', worried = k.mood === 'worried';
  ctx.save();
  ctx.translate(ox * s, oy * s);

  // Rosy cheeks
  ctx.fillStyle = 'rgba(255,140,170,0.65)';
  [-0.2, 0.78].forEach(bx => {
    ctx.beginPath();
    ctx.ellipse(bx * s, s * 0.3, s * 0.17, s * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Eyes: blink every few seconds, go wide when scared
  const blinking = !scared && (t + k.phase * 3) % 4 < 0.15;
  [0.05, 0.55].forEach(ex => {
    const x = ex * s, y = -s * 0.15;
    if (blinking) {
      ctx.strokeStyle = '#1d1633';
      ctx.lineWidth = Math.max(1.5, s * 0.08);
      ctx.beginPath();
      ctx.arc(x, y, s * 0.2, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, s * (scared ? 0.33 : 0.29), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1d1633';
    ctx.beginPath();
    ctx.arc(x + s * 0.04, y + s * 0.03, s * (scared ? 0.1 : 0.2), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + s * 0.1, y - s * 0.06, s * 0.07, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.strokeStyle = '#1d1633';
  ctx.lineWidth = Math.max(1.2, s * 0.08);

  // Sad eyebrows, slanting down toward the outside
  if (sad) {
    [[0.05, -1], [0.55, 1]].forEach(([ex, side]) => {
      ctx.beginPath();
      ctx.moveTo(ex * s + side * s * 0.2, -s * 0.5);
      ctx.lineTo(ex * s - side * s * 0.2, -s * 0.62);
      ctx.stroke();
    });
  }

  // Mouth: smile, frown when sad, wobbly when worried, "o" when scared
  ctx.beginPath();
  if (sad) {
    ctx.arc(s * 0.3, s * 0.5, s * 0.15, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  } else if (scared) {
    ctx.fillStyle = '#1d1633';
    ctx.ellipse(s * 0.3, s * 0.38, s * 0.1, s * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (worried) {
    ctx.moveTo(s * 0.15, s * 0.38);
    ctx.quadraticCurveTo(s * 0.22, s * 0.3, s * 0.3, s * 0.38);
    ctx.quadraticCurveTo(s * 0.38, s * 0.46, s * 0.45, s * 0.38);
    ctx.stroke();
  } else {
    ctx.arc(s * 0.3, s * 0.22, s * 0.15, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

// Each drawer paints one critter facing right at the origin, s = body size
const DRAW = {
  firefly(s, t, c, k) {
    // Wings flap faster when scared
    const flap = Math.sin(t * (k.fleeing ? 40 : 18) + k.phase) * 0.35;
    ctx.fillStyle = 'rgba(215,235,255,0.55)';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    [[-0.6, -0.6, -1.0], [-0.25, -0.8, -0.55]].forEach(([wx, wy, rot]) => {
      ctx.beginPath();
      ctx.ellipse(wx * s, wy * s, s * 0.42, s * 0.85, rot + flap, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    // Glowing tail
    ctx.fillStyle = rgb(mix(c, WHITE, k.pulse(t) * 0.5));
    ctx.beginPath();
    ctx.ellipse(-s * 0.95, s * 0.35, s * 0.7, s * 0.6, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#6b5a9e';
    ctx.strokeStyle = '#3d3266';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Antennae
    ctx.strokeStyle = '#3d3266';
    ctx.lineWidth = Math.max(1.5, s * 0.1);
    [[0.15, -0.9, 0.3, -1.6], [0.5, -0.8, 0.95, -1.4]].forEach(([x1, y1, x2, y2]) => {
      ctx.beginPath();
      ctx.moveTo(x1 * s, y1 * s);
      ctx.quadraticCurveTo(x1 * s, y2 * s, x2 * s, y2 * s);
      ctx.stroke();
      ctx.fillStyle = rgb(c);
      ctx.beginPath();
      ctx.arc(x2 * s, y2 * s, s * 0.14, 0, Math.PI * 2);
      ctx.fill();
    });
    drawFace(k, s, t);
  },

  fish(s, t, c, k) {
    const wag = Math.sin(t * (k.fleeing ? 25 : 8) + k.phase) * 0.3;
    const dark = mix(c, BLACK, 0.2);

    // Tail
    ctx.save();
    ctx.translate(-s * 0.85, 0);
    ctx.rotate(wag);
    ctx.fillStyle = rgb(dark);
    ctx.beginPath();
    ctx.moveTo(s * 0.1, 0);
    ctx.quadraticCurveTo(-s * 0.4, -s * 0.9, -s * 0.75, -s * 0.75);
    ctx.quadraticCurveTo(-s * 0.45, 0, -s * 0.75, s * 0.75);
    ctx.quadraticCurveTo(-s * 0.4, s * 0.9, s * 0.1, 0);
    ctx.fill();
    ctx.restore();

    // Top fin
    ctx.fillStyle = rgb(dark);
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, -s * 0.65);
    ctx.quadraticCurveTo(-s * 0.15, -s * 1.35, s * 0.35, -s * 0.75);
    ctx.fill();

    // Body
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.05, s * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // Clownfish stripes
    if (k.kind === 'clownfish') {
      ctx.save();
      ctx.clip();
      // Stripes stay on the back half so they don't ring the face
      [[-0.52, 0.2], [-1.0, 0.13]].forEach(([sx, w]) => {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#2a1a10';
        ctx.lineWidth = Math.max(1.5, s * 0.07);
        ctx.beginPath();
        ctx.ellipse(sx * s, 0, w * s, s * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();
      ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
      ctx.lineWidth = 1.5;
      // Re-trace the body so the outline isn't drawn around the last stripe
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 1.05, s * 0.85, 0, 0, Math.PI * 2);
    }
    ctx.stroke();

    // Side fin
    ctx.fillStyle = rgb(mix(c, WHITE, 0.3));
    ctx.beginPath();
    ctx.ellipse(-s * 0.3, s * 0.45, s * 0.3, s * 0.14, 0.5 + wag, 0, Math.PI * 2);
    ctx.fill();
    drawFace(k, s, t);
  },

  clownfish(s, t, c, k) { DRAW.fish(s, t, c, k); },

  puffer(s, t, c, k) {
    // Puffs up when scared
    if (k.fleeing) ctx.scale(1.3, 1.3);
    const dark = mix(c, BLACK, 0.3);

    // Tail
    const wag = Math.sin(t * 8 + k.phase) * 0.3;
    ctx.save();
    ctx.translate(-s * 0.95, 0);
    ctx.rotate(wag);
    ctx.fillStyle = rgb(dark);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.5, -s * 0.4);
    ctx.lineTo(-s * 0.5, s * 0.4);
    ctx.fill();
    ctx.restore();

    // Spikes
    ctx.fillStyle = rgb(dark);
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.1) * s * 0.95, Math.sin(a - 0.1) * s * 0.95);
      ctx.lineTo(Math.cos(a) * s * 1.25, Math.sin(a) * s * 1.25);
      ctx.lineTo(Math.cos(a + 0.1) * s * 0.95, Math.sin(a + 0.1) * s * 0.95);
      ctx.fill();
    }

    // Round body with a pale belly
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = rgb(mix(c, WHITE, 0.6));
    ctx.beginPath();
    ctx.ellipse(0, s * 0.75, s * 1.1, s * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawFace(k, s, t);
  },

  jelly(s, t, c, k) {
    // Wavy tentacles
    ctx.strokeStyle = rgb(c, 0.75);
    ctx.lineWidth = Math.max(2, s * 0.12);
    ctx.lineCap = 'round';
    const speed = k.fleeing ? 10 : 3;
    for (let i = 0; i < 5; i++) {
      const x0 = (-0.6 + i * 0.3) * s;
      ctx.beginPath();
      ctx.moveTo(x0, s * 0.3);
      for (let j = 1; j <= 6; j++) {
        ctx.lineTo(x0 + Math.sin(t * speed + i + j * 0.9) * s * 0.15, s * 0.3 + j * s * 0.22);
      }
      ctx.stroke();
    }

    // Dome with a scalloped edge
    ctx.fillStyle = rgb(c, 0.9);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.25));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, s * 0.3, s * 1.05, Math.PI, 0);
    for (let i = 0; i < 6; i++) {
      const x1 = s * 1.05 - (i + 1) * s * 0.35;
      ctx.quadraticCurveTo(x1 + s * 0.175, s * 0.5, x1, s * 0.3);
    }
    ctx.fill();
    ctx.stroke();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(-s * 0.5, -s * 0.35, s * 0.18, s * 0.28, 0.5, 0, Math.PI * 2);
    ctx.fill();
    drawFace(k, s, t, -0.3, 0);
  },

  octopus(s, t, c, k) {
    const dark = mix(c, BLACK, 0.15);
    // Curly arms
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = s * 0.28;
    ctx.lineCap = 'round';
    const speed = k.fleeing ? 12 : 3;
    for (let i = 0; i < 6; i++) {
      const x0 = (-0.75 + i * 0.3) * s;
      const sway = Math.sin(t * speed + i * 1.3) * s * 0.3;
      ctx.beginPath();
      ctx.moveTo(x0, s * 0.4);
      ctx.quadraticCurveTo(x0 + sway, s * 1.1, x0 + sway * 1.5 + (i < 3 ? -1 : 1) * s * 0.25, s * 1.35);
      ctx.stroke();
    }

    // Head
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.1, s * 1.0, s * 0.95, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Spots
    ctx.fillStyle = rgb(mix(c, WHITE, 0.35));
    [[-0.55, -0.6, 0.12], [-0.25, -0.8, 0.09], [0.6, -0.65, 0.1]].forEach(([x, y, r]) => {
      ctx.beginPath();
      ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2);
      ctx.fill();
    });
    drawFace(k, s, t, -0.3, 0.05);
  },

  narwhal(s, t, c, k) {
    const wag = Math.sin(t * (k.fleeing ? 20 : 5) + k.phase) * 0.25;

    // Tail flukes
    ctx.save();
    ctx.translate(-s * 1.25, -s * 0.05);
    ctx.rotate(wag);
    ctx.fillStyle = rgb(mix(c, BLACK, 0.15));
    ctx.beginPath();
    ctx.moveTo(s * 0.15, 0);
    ctx.quadraticCurveTo(-s * 0.3, -s * 0.2, -s * 0.55, -s * 0.5);
    ctx.quadraticCurveTo(-s * 0.35, 0, -s * 0.55, s * 0.5);
    ctx.quadraticCurveTo(-s * 0.3, s * 0.2, s * 0.15, 0);
    ctx.fill();
    ctx.restore();

    // Horn
    ctx.fillStyle = '#fff6d8';
    ctx.strokeStyle = '#d8c690';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(s * 0.55, -s * 0.62);
    ctx.lineTo(s * 1.45, -s * 1.45);
    ctx.lineTo(s * 0.8, -s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Body with a pale belly
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 1.35, s * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = rgb(mix(c, WHITE, 0.6));
    ctx.beginPath();
    ctx.ellipse(s * 0.1, s * 0.8, s * 1.4, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Flipper
    ctx.fillStyle = rgb(mix(c, BLACK, 0.15));
    ctx.beginPath();
    ctx.ellipse(-s * 0.2, s * 0.5, s * 0.35, s * 0.15, 0.6 + wag, 0, Math.PI * 2);
    ctx.fill();
    drawFace(k, s, t, 0.25, 0);
  },

  ghost(s, t, c, k) {
    // Rainbow ghost uses soft pastel colors
    const body = k.baseColor ? c : mix(c, WHITE, 0.4);
    const wave = t * (k.fleeing ? 12 : 4) + k.phase;
    ctx.fillStyle = rgb(body, 0.95);
    ctx.strokeStyle = rgb(mix(body, BLACK, 0.25));
    ctx.lineWidth = 1.5;

    // Little arms
    [[0.95, -0.5], [-0.95, 0.5]].forEach(([ax, rot]) => {
      ctx.beginPath();
      ctx.ellipse(ax * s, s * 0.25, s * 0.25, s * 0.13, rot + Math.sin(wave) * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    // Rounded head with a wavy hem
    ctx.beginPath();
    ctx.arc(0, -s * 0.1, s, Math.PI, 0);
    ctx.lineTo(s, s * 0.85);
    for (let i = 0; i < 4; i++) {
      const x1 = s - (i + 1) * s * 0.5;
      ctx.quadraticCurveTo(x1 + s * 0.25, s * (0.85 + 0.25 * Math.sin(wave + i * 1.5)), x1, s * 0.85);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    drawFace(k, s, t, -0.25, 0);
  },

  pumpkin(s, t, c, k) {
    ctx.translate(0, Math.sin(t * 3 + k.phase) * s * 0.06);

    // Stem and leaf
    ctx.fillStyle = '#6b8e3a';
    ctx.beginPath();
    ctx.moveTo(-s * 0.12, -s * 0.75);
    ctx.lineTo(-s * 0.05, -s * 1.2);
    ctx.lineTo(s * 0.15, -s * 1.15);
    ctx.lineTo(s * 0.12, -s * 0.75);
    ctx.fill();
    ctx.fillStyle = '#7fb24a';
    ctx.beginPath();
    ctx.ellipse(s * 0.4, -s * 1.0, s * 0.3, s * 0.13, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // Round segments
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.3));
    ctx.lineWidth = 1.5;
    [[-0.5, 0.6], [0.5, 0.6], [0, 0.65]].forEach(([x, rx]) => {
      ctx.fillStyle = rgb(x ? mix(c, BLACK, 0.1) : c);
      ctx.beginPath();
      ctx.ellipse(x * s, 0, rx * s, s * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    drawFace(k, s, t, -0.3, 0.05);
  },

  bat(s, t, c, k) {
    const flap = Math.sin(t * (k.fleeing ? 30 : 12) + k.phase);
    const dark = mix(c, BLACK, 0.35);

    // Scalloped wings
    ctx.fillStyle = rgb(dark);
    [-1, 1].forEach(side => {
      ctx.save();
      ctx.scale(side, 1);
      ctx.translate(s * 0.7, -s * 0.1);
      ctx.scale(1, 0.6 + 0.4 * flap);
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.4);
      ctx.quadraticCurveTo(s * 0.8, -s * 0.9, s * 1.3, -s * 0.3);
      ctx.quadraticCurveTo(s * 1.05, -s * 0.05, s * 0.85, s * 0.1);
      ctx.quadraticCurveTo(s * 0.65, -s * 0.1, s * 0.45, s * 0.2);
      ctx.quadraticCurveTo(s * 0.25, 0, 0, s * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Pointy ears
    ctx.fillStyle = rgb(c);
    [-0.55, 0.55].forEach(ex => {
      ctx.beginPath();
      ctx.moveTo(ex * s - s * 0.28, -s * 0.65);
      ctx.lineTo(ex * s, -s * 1.25);
      ctx.lineTo(ex * s + s * 0.28, -s * 0.65);
      ctx.fill();
    });

    // Body
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    drawFace(k, s, t, -0.3, 0.05);

    // A tiny fang when happy
    if (k.mood === 'happy') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(s * 0.06, s * 0.35);
      ctx.lineTo(s * 0.11, s * 0.5);
      ctx.lineTo(s * 0.16, s * 0.35);
      ctx.fill();
    }
  },

  cat(s, t, c, k) {
    const dark = mix(c, BLACK, 0.35);

    // Curly tail
    ctx.strokeStyle = rgb(c);
    ctx.lineWidth = s * 0.22;
    ctx.lineCap = 'round';
    const sway = Math.sin(t * 3 + k.phase) * s * 0.3;
    ctx.beginPath();
    ctx.moveTo(-s * 0.7, s * 0.5);
    ctx.quadraticCurveTo(-s * 1.6, s * 0.3 + sway, -s * 1.3, -s * 0.5);
    ctx.stroke();

    // Ears with pink insides
    [-0.6, 0.6].forEach(ex => {
      ctx.fillStyle = rgb(c);
      ctx.beginPath();
      ctx.moveTo(ex * s - s * 0.33, -s * 0.6);
      ctx.lineTo(ex * s, -s * 1.15);
      ctx.lineTo(ex * s + s * 0.33, -s * 0.6);
      ctx.fill();
      ctx.fillStyle = '#f2a5c0';
      ctx.beginPath();
      ctx.moveTo(ex * s - s * 0.16, -s * 0.7);
      ctx.lineTo(ex * s, -s * 0.98);
      ctx.lineTo(ex * s + s * 0.16, -s * 0.7);
      ctx.fill();
    });

    // Head
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Little witch hat
    ctx.save();
    ctx.translate(s * 0.05, -s * 0.85);
    ctx.rotate(0.15);
    ctx.fillStyle = '#3a2560';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.7, s * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.4, 0);
    ctx.quadraticCurveTo(-s * 0.1, -s * 0.6, s * 0.3, -s * 1.05);
    ctx.quadraticCurveTo(s * 0.15, -s * 0.5, s * 0.4, 0);
    ctx.fill();
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(-s * 0.37, -s * 0.2, s * 0.74, s * 0.13);
    ctx.restore();

    // Whiskers
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    [-1, 1].forEach(side => {
      [0.2, 0.42].forEach(wy => {
        ctx.beginPath();
        ctx.moveTo(side * s * 0.45, s * 0.3);
        ctx.lineTo(side * s * 1.05, s * wy);
        ctx.stroke();
      });
    });
    drawFace(k, s, t, -0.3, 0.05);
  },

  zombie(s, t, c, k) {
    const dark = mix(c, BLACK, 0.35);
    const reach = Math.sin(t * 2 + k.phase) * s * 0.08;

    // Torn shirt
    ctx.fillStyle = '#5b7bb5';
    ctx.beginPath();
    ctx.moveTo(-s * 0.6, s * 0.6);
    ctx.lineTo(s * 0.6, s * 0.6);
    ctx.lineTo(s * 0.5, s * 1.4);
    ctx.lineTo(s * 0.3, s * 1.25);
    ctx.lineTo(s * 0.1, s * 1.42);
    ctx.lineTo(-s * 0.15, s * 1.25);
    ctx.lineTo(-s * 0.35, s * 1.42);
    ctx.lineTo(-s * 0.5, s * 1.4);
    ctx.closePath();
    ctx.fill();

    // Arms reaching forward
    ctx.strokeStyle = rgb(c);
    ctx.lineWidth = s * 0.24;
    ctx.lineCap = 'round';
    [0.75, 0.98].forEach((y, i) => {
      ctx.beginPath();
      ctx.moveTo(s * 0.2, s * y);
      ctx.lineTo(s * 1.25 + (i ? -reach : reach), s * (y - 0.1));
      ctx.stroke();
    });

    // Head
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Messy hair
    ctx.fillStyle = '#3b2f2a';
    [-0.45, -0.1, 0.25].forEach(hx => {
      ctx.beginPath();
      ctx.moveTo(hx * s - s * 0.22, -s * 0.85);
      ctx.lineTo(hx * s + s * 0.05, -s * 1.25);
      ctx.lineTo(hx * s + s * 0.25, -s * 0.85);
      ctx.fill();
    });

    // Stitches
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-s * 0.8, -s * 0.4);
    ctx.lineTo(-s * 0.4, -s * 0.62);
    ctx.stroke();
    [0.25, 0.5, 0.75].forEach(f => {
      const x = -s * 0.8 + s * 0.4 * f, y = -s * 0.4 - s * 0.22 * f;
      ctx.beginPath();
      ctx.moveTo(x - s * 0.05, y - s * 0.08);
      ctx.lineTo(x + s * 0.05, y + s * 0.08);
      ctx.stroke();
    });
    drawFace(k, s, t, -0.3, 0.05);
  },

  // Blooms are drawn centered on the face; the stem is drawn by Critter.drawPlant
  flower(s, t, c, k) {
    // Rainbow Bloom gives each petal its own color
    drawPetals(s, 8, 0.95, 0.42, i => k.baseColor ? c : rainbow(t + i * 0.3125), false);
    drawCenter(s, [255, 213, 79]);
    drawFace(k, s, t, -0.3, 0.05);
  },

  sunflower(s, t, c, k) {
    drawPetals(s, 18, 1.05, 0.22, () => c, true);
    drawCenter(s, [205, 145, 75]);
    drawFace(k, s, t, -0.3, 0.05);
  },

  star(s, t, c, k) {
    drawPetals(s, 5, 1.2, 0.55, () => c, true);
    drawCenter(s, [255, 240, 185]);
    drawFace(k, s, t, -0.3, 0.05);
  },

  rose(s, t, c, k) {
    // Two rings of round petals around a swirled center
    [[7, 1.05, 0.62, mix(c, BLACK, 0.18)], [6, 0.6, 0.55, c]].forEach(([n, d, r, col], ring) => {
      ctx.fillStyle = rgb(col);
      ctx.strokeStyle = rgb(mix(col, BLACK, 0.25));
      ctx.lineWidth = 1.2;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + ring * 0.4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * d * s, Math.sin(a) * d * s, r * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    });
    drawCenter(s, mix(c, WHITE, 0.3));
    drawFace(k, s, t, -0.3, 0.05);
  },

  tulip(s, t, c, k) {
    // Cup with three pointed tips
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.3));
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-s * 1.05, -s * 0.2);
    ctx.lineTo(-s * 0.75, -s * 1.25);
    ctx.lineTo(-s * 0.35, -s * 0.65);
    ctx.lineTo(0, -s * 1.35);
    ctx.lineTo(s * 0.35, -s * 0.65);
    ctx.lineTo(s * 0.75, -s * 1.25);
    ctx.lineTo(s * 1.05, -s * 0.2);
    ctx.quadraticCurveTo(s * 1.05, s * 1.0, 0, s * 1.0);
    ctx.quadraticCurveTo(-s * 1.05, s * 1.0, -s * 1.05, -s * 0.2);
    ctx.fill();
    ctx.stroke();
    drawFace(k, s, t, -0.3, 0.1);
  },

  leaf(s, t, c, k) {
    // Gentle flutter, faster when blowing away
    ctx.rotate(Math.sin(t * (k.fleeing ? 10 : 2) + k.phase) * 0.15);
    const dark = mix(c, BLACK, 0.3), vein = mix(c, WHITE, 0.35);

    // Stem
    ctx.strokeStyle = '#7a4a26';
    ctx.lineWidth = Math.max(2, s * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, s * 0.85);
    ctx.quadraticCurveTo(s * 0.05, s * 1.3, s * 0.25, s * 1.55);
    ctx.stroke();

    // Wide maple-style lobes around a round middle
    const lobes = [[-90, 1.75], [-148, 1.6], [-32, 1.6], [150, 1.35], [30, 1.35]];
    const at = (a, r) => [Math.cos(a) * s * r, Math.sin(a) * s * r];
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    lobes.forEach(([deg, len]) => {
      const a = deg * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(...at(a - 0.55, 0.5));
      ctx.quadraticCurveTo(...at(a - 0.42, len * 0.85), ...at(a, len));
      ctx.quadraticCurveTo(...at(a + 0.42, len * 0.85), ...at(a + 0.55, 0.5));
      ctx.fill();
      ctx.stroke();
    });
    ctx.strokeStyle = rgb(vein);
    ctx.lineWidth = Math.max(1, s * 0.06);
    lobes.forEach(([deg, len]) => {
      const a = deg * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s * 0.8, Math.sin(a) * s * 0.8);
      ctx.lineTo(Math.cos(a) * s * (len - 0.15), Math.sin(a) * s * (len - 0.15));
      ctx.stroke();
    });

    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.95, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawFace(k, s, t, -0.3, 0.05);
  },

  turkey(s, t, c, k) {
    // Fanned tail feathers
    const fan = ['#c0392b', '#e67e22', '#f1c40f', '#8e5a2b'];
    const wiggle = Math.sin(t * 3 + k.phase) * 0.05;
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI * (0.92 - i * 0.14) + wiggle;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = fan[i % 4];
      ctx.beginPath();
      ctx.ellipse(s * 1.1, 0, s * 0.75, s * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // Feet
    ctx.strokeStyle = '#e8a33c';
    ctx.lineWidth = Math.max(2, s * 0.12);
    [-0.3, 0.3].forEach(fx => {
      ctx.beginPath(); ctx.moveTo(fx * s, s * 0.8); ctx.lineTo(fx * s, s * 1.2); ctx.stroke();
    });
    // Body
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawFace(k, s, t, -0.3, 0.05);
    // Beak and wattle
    ctx.fillStyle = '#f2b134';
    ctx.beginPath();
    ctx.moveTo(-s * 0.1, s * 0.02); ctx.lineTo(s * 0.1, s * 0.02); ctx.lineTo(0, s * 0.18);
    ctx.fill();
    ctx.fillStyle = '#e04848';
    ctx.beginPath(); ctx.ellipse(s * 0.1, s * 0.22, s * 0.06, s * 0.13, 0.3, 0, Math.PI * 2); ctx.fill();
  },

  squirrel(s, t, c, k) {
    const dark = mix(c, BLACK, 0.3);
    // Big bushy tail
    const sway = Math.sin(t * 2.5 + k.phase) * 0.12;
    ctx.fillStyle = rgb(mix(c, WHITE, 0.1));
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(-s * 1.0, -s * 0.45, s * 0.6, s * 1.15, -0.4 + sway, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgb(mix(c, WHITE, 0.4));
    ctx.beginPath(); ctx.ellipse(-s * 1.0, -s * 0.45, s * 0.25, s * 0.8, -0.4 + sway, 0, Math.PI * 2); ctx.fill();
    // Ears
    ctx.fillStyle = rgb(c);
    [-0.5, 0.5].forEach(ex => {
      ctx.beginPath(); ctx.ellipse(ex * s, -s * 0.9, s * 0.2, s * 0.32, ex * 0.6, 0, Math.PI * 2); ctx.fill();
    });
    // Head and pale muzzle
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgb(mix(c, WHITE, 0.55));
    ctx.beginPath(); ctx.ellipse(0, s * 0.45, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    drawFace(k, s, t, -0.3, 0);
    // Tiny acorn snack
    ctx.fillStyle = '#b07a45';
    ctx.beginPath(); ctx.ellipse(s * 0.35, s * 0.95, s * 0.2, s * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6e4826';
    ctx.beginPath(); ctx.ellipse(s * 0.35, s * 0.78, s * 0.22, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  },

  corn(s, t, c, k) {
    // Glass Gem corn (no base color) gets jewel-colored kernels
    const gem = !k.baseColor;
    ctx.fillStyle = gem ? '#f5e6c8' : rgb(c);
    ctx.strokeStyle = gem ? '#b8a37a' : rgb(mix(c, BLACK, 0.3));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.8, s * 1.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.clip();
    let n = 0;
    for (let row = 0, y = -s * 1.25; y < s * 1.3; row++, y += s * 0.22) {
      for (let x = -s * 0.75 + (row % 2) * s * 0.11; x < s * 0.8; x += s * 0.22, n++) {
        ctx.fillStyle = rgb(gem ? rainbow(n * 0.37) : mix(c, WHITE, 0.3));
        ctx.beginPath(); ctx.arc(x, y, s * 0.085, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.8, s * 1.3, 0, 0, Math.PI * 2); ctx.stroke();
    // Green husks wrapping the bottom
    ctx.fillStyle = '#6fae45';
    ctx.strokeStyle = '#4c8a2e';
    [-1, 1].forEach(side => {
      ctx.beginPath();
      ctx.moveTo(0, s * 1.45);
      ctx.quadraticCurveTo(side * s * 1.15, s * 0.7, side * s * 0.8, -s * 0.45);
      ctx.quadraticCurveTo(side * s * 0.55, s * 0.6, 0, s * 1.45);
      ctx.fill();
      ctx.stroke();
    });
    drawFace(k, s, t, -0.3, -0.1);
  },

  pie(s, t, c, k) {
    // Scalloped crust
    ctx.fillStyle = '#d9a35b';
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * s * 1.05, Math.sin(a) * s * 1.05, s * 0.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, s * 1.08, 0, Math.PI * 2); ctx.fill();
    // Pumpkin filling
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.25));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.88, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawFace(k, s, t, -0.3, 0.1);
    // Whipped cream dollop
    ctx.fillStyle = '#fffaf0';
    [[0.55, -0.75, 0.22], [0.75, -0.65, 0.17], [0.62, -0.93, 0.15]].forEach(([x, y, r]) => {
      ctx.beginPath(); ctx.arc(x * s, y * s, r * s, 0, Math.PI * 2); ctx.fill();
    });
  },

  alien(s, t, c, k) {
    const dark = mix(c, BLACK, 0.3);
    // Antennae that bob
    const bob = Math.sin(t * 4 + k.phase) * s * 0.08;
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = Math.max(1.5, s * 0.1);
    [[-0.35, -0.55], [0.35, 0.55]].forEach(([x0, x1]) => {
      ctx.beginPath(); ctx.moveTo(x0 * s, -s * 0.85); ctx.lineTo(x1 * s, -s * 1.5 + bob); ctx.stroke();
      ctx.fillStyle = rgb(mix(c, WHITE, 0.4));
      ctx.beginPath(); ctx.arc(x1 * s, -s * 1.5 + bob, s * 0.15, 0, Math.PI * 2); ctx.fill();
    });
    // Blobby body with little feet
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(dark);
    ctx.lineWidth = 1.5;
    [-0.5, 0, 0.5].forEach(fx => {
      ctx.beginPath(); ctx.ellipse(fx * s, s * 0.85, s * 0.22, s * 0.18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.95, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawFace(k, s, t, -0.3, 0.05);
  },

  rocket(s, t, c, k) {
    // Flickering flame out the back
    const flick = 0.8 + 0.3 * Math.sin(t * 30 + k.phase);
    ctx.fillStyle = '#ffb02e';
    ctx.beginPath();
    ctx.moveTo(-s * 1.2, -s * 0.35); ctx.lineTo(-s * (1.2 + flick), 0); ctx.lineTo(-s * 1.2, s * 0.35);
    ctx.fill();
    ctx.fillStyle = '#fff3a0';
    ctx.beginPath();
    ctx.moveTo(-s * 1.2, -s * 0.18); ctx.lineTo(-s * (1.2 + flick * 0.55), 0); ctx.lineTo(-s * 1.2, s * 0.18);
    ctx.fill();
    // Fins
    ctx.fillStyle = rgb(c);
    [-1, 1].forEach(side => {
      ctx.beginPath();
      ctx.moveTo(-s * 0.6, side * s * 0.6); ctx.lineTo(-s * 1.25, side * s * 1.05); ctx.lineTo(-s * 1.2, side * s * 0.3);
      ctx.fill();
    });
    // Body and red nose cone
    ctx.fillStyle = '#f2f4f8';
    ctx.strokeStyle = '#9aa3b5';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 1.3, s * 0.78, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgb(c);
    ctx.beginPath();
    ctx.moveTo(s * 0.95, -s * 0.55);
    ctx.quadraticCurveTo(s * 1.7, -s * 0.2, s * 1.75, 0);
    ctx.quadraticCurveTo(s * 1.7, s * 0.2, s * 0.95, s * 0.55);
    ctx.quadraticCurveTo(s * 1.15, 0, s * 0.95, -s * 0.55);
    ctx.fill();
    drawFace(k, s, t, -0.4, 0);
  },

  astronaut(s, t, c, k) {
    ctx.rotate(Math.sin(t * 1.2 + k.phase) * 0.12);
    // Backpack
    ctx.fillStyle = '#b9c0cf';
    ctx.fillRect(-s * 0.95, s * 0.5, s * 0.4, s * 0.9);
    // Suit body, arms and legs
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = '#9aa3b5';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, s * 1.1, s * 0.62, s * 0.55, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    [[-0.65, 0.95, 0.6], [0.65, 0.95, -0.6]].forEach(([x, y, rot]) => {
      ctx.beginPath(); ctx.ellipse(x * s, y * s, s * 0.32, s * 0.16, rot, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    [-0.25, 0.25].forEach(x => {
      ctx.beginPath(); ctx.ellipse(x * s, s * 1.6, s * 0.17, s * 0.25, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    // Control panel
    ['#ff5d5d', '#5dc8ff', '#ffd84d'].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.fillRect((-0.25 + i * 0.18) * s, s * 1.0, s * 0.12, s * 0.12);
    });
    // Helmet with a light blue visor
    ctx.fillStyle = rgb(c);
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b4dcff';
    ctx.strokeStyle = '#7fa8d6';
    ctx.beginPath(); ctx.ellipse(0, s * 0.05, s * 0.8, s * 0.66, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-s * 0.5, -s * 0.3, s * 0.12, s * 0.2, 0.5, 0, Math.PI * 2); ctx.fill();
    drawFace(k, s, t, -0.3, 0.08);
  },

  planet(s, t, c, k) {
    const ring = '#f5d69b';
    ctx.strokeStyle = ring;
    ctx.lineWidth = s * 0.18;
    // Back half of the ring, behind the planet
    ctx.beginPath(); ctx.ellipse(0, s * 0.35, s * 1.75, s * 0.45, -0.2, Math.PI, Math.PI * 2); ctx.stroke();
    // Planet with soft bands
    ctx.fillStyle = rgb(c);
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = rgb(mix(c, WHITE, 0.3));
    [-0.55, 0.65].forEach(by => ctx.fillRect(-s, by * s, s * 2, s * 0.22));
    ctx.restore();
    drawFace(k, s, t, -0.3, -0.05);
    // Front half of the ring
    ctx.strokeStyle = ring;
    ctx.lineWidth = s * 0.18;
    ctx.beginPath(); ctx.ellipse(0, s * 0.35, s * 1.75, s * 0.45, -0.2, 0, Math.PI); ctx.stroke();
  },

  ufo(s, t, c, k) {
    // Glass dome with the pilot's face
    ctx.fillStyle = 'rgba(180,230,255,0.75)';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -s * 0.15, s * 0.95, Math.PI, 0); ctx.fill(); ctx.stroke();
    // Saucer with blinking lights
    ctx.fillStyle = rgb(c);
    ctx.strokeStyle = rgb(mix(c, BLACK, 0.35));
    ctx.beginPath(); ctx.ellipse(0, s * 0.2, s * 1.7, s * 0.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ['#ff5d5d', '#ffd84d', '#6ee7a8', '#5dc8ff', '#ff8de0'].forEach((col, i) => {
      const on = Math.sin(t * 6 + i * 1.3) > 0;
      ctx.fillStyle = on ? col : 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc((-1.1 + i * 0.55) * s, s * 0.3, s * 0.11, 0, Math.PI * 2); ctx.fill();
    });
    drawFace(k, s, t, -0.3, -0.45);
  },

  comet(s, t, c, k) {
    // Rainbow tail of fading puffs
    for (let i = 10; i >= 1; i--) {
      ctx.fillStyle = rgb(rainbow(t + i * 0.1), 0.6 * (1 - i / 11));
      ctx.beginPath();
      ctx.arc(-i * s * 0.38, Math.sin(t * 3 + i * 0.6) * s * 0.08 * i, s * (1 - i * 0.07), 0, Math.PI * 2);
      ctx.fill();
    }
    // Glowing icy head
    const glow = ctx.createRadialGradient(0, 0, s * 0.5, 0, 0, s * 1.6);
    glow.addColorStop(0, 'rgba(255,250,220,0.6)');
    glow.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, s * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff6d0';
    ctx.strokeStyle = '#e0cf8f';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawFace(k, s, t, -0.3, 0.05);
  },
};

// Ring of petals around the bloom's center; colorFn(i) picks each petal's color
function drawPetals(s, n, len, width, colorFn, pointed) {
  for (let i = 0; i < n; i++) {
    const col = colorFn(i);
    ctx.save();
    ctx.rotate(i / n * Math.PI * 2);
    ctx.fillStyle = rgb(col);
    ctx.strokeStyle = rgb(mix(col, BLACK, 0.2));
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (pointed) {
      ctx.moveTo(s * 0.6, -s * width);
      ctx.quadraticCurveTo(s * (0.7 + len * 0.6), -s * width * 1.2, s * (0.75 + len), 0);
      ctx.quadraticCurveTo(s * (0.7 + len * 0.6), s * width * 1.2, s * 0.6, s * width);
    } else {
      ctx.ellipse(s * (0.7 + len * 0.5), 0, s * len * 0.6, s * width, 0, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

function drawCenter(s, col) {
  ctx.fillStyle = rgb(col);
  ctx.strokeStyle = rgb(mix(col, BLACK, 0.25));
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// Little twinkling stars around rares so they stand out in every scene
function drawSparkles(x, y, s, t) {
  ctx.fillStyle = 'rgba(255,255,220,0.9)';
  for (let i = 0; i < 3; i++) {
    const a = t * 1.5 + i * Math.PI * 2 / 3;
    const px = x + Math.cos(a) * s * 1.9, py = y + Math.sin(a) * s * 1.6;
    const r = s * 0.25 * (0.6 + 0.4 * Math.sin(t * 5 + i));
    ctx.beginPath();
    ctx.moveTo(px, py - r);
    ctx.quadraticCurveTo(px, py, px + r, py);
    ctx.quadraticCurveTo(px, py, px, py + r);
    ctx.quadraticCurveTo(px, py, px - r, py);
    ctx.quadraticCurveTo(px, py, px, py - r);
    ctx.fill();
  }
}

// ---- Critters ----
class Critter {
  constructor(spec, rare = null) {
    this.kind = spec.kind;
    this.baseColor = spec.color;
    this.rare = rare;
    this.born = performance.now();
    this.life = LIFE_MIN_MS + Math.random() * LIFE_RANGE_MS;
    this.collecting = false;
    this.done = false;
    const fromLeft = Math.random() < 0.5;
    const [x0, x1, y0, y1] = scene.home;
    this.x = fromLeft ? -40 : W + 40;
    this.y = H * (y0 + Math.random() * (y1 - y0));
    this.homeX = W * (x0 + Math.random() * (x1 - x0));
    this.homeY = H * (y0 + Math.random() * (y1 - y0));
    this.vx = 0; this.vy = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.blink = 1.5 + Math.random() * 2;
    this.size = rare ? scene.rareSize : scene.size[0] + Math.random() * (scene.size[1] - scene.size[0]);
    this.dir = fromLeft ? 1 : -1;
    this.nervous = 0;
    this.mood = 'happy';
    this.alpha = 0;
    this.fleeing = false;
    // Flowers are planted at a spot in the soil and grow up from it
    this.plant = !!scene.grow;
    if (this.plant) {
      this.x = this.homeX;
      this.y = this.homeY;
      this.stemH = H * (0.12 + Math.random() * 0.22);
      // Flowers under the basket panel stay short so their blooms aren't hidden behind it
      const jarBox = $('jar').getBoundingClientRect();
      if (this.homeX < jarBox.right + this.size * 2) {
        this.stemH = Math.min(this.stemH, Math.max(H * 0.04, this.homeY - jarBox.bottom - this.size * 2.5));
      }
      this.growth = 0;
      this.dir = 1;
      this.bloomX = this.x;
      this.bloomY = this.y;
    }
  }
  // Calmly head off screen (or shrink back down) to make room for new arrivals
  leave() {
    this.leaving = true;
    this.nervous = 0;
    this.leaveDir = this.x < W / 2 ? -1 : 1;
  }
  get settled() {
    return !this.rare && !this.fleeing && !this.leaving && !this.collecting && (this.plant ? this.growth >= 1 : this.alpha >= 1);
  }
  collect() {
    // A picked flower's bloom flies to the basket from the top of its stem
    if (this.plant) { this.x = this.bloomX; this.y = this.bloomY; }
    this.collecting = true;
  }
  scare(cx, cy) {
    if (this.collecting) return;
    this.fleeing = true;
    if (this.plant) return;
    let dx = this.x - cx, dy = this.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    const speed = 500 + Math.random() * 400;
    this.vx = dx / d * speed;
    this.vy = dy / d * speed - 100;
  }
  update(dt, t, nervous) {
    if (this.done) return;
    if (this.plant && !this.collecting) {
      if (this.fleeing) {
        // Shrink back into the ground
        this.growth -= dt * 1.5;
        if (this.growth <= 0) this.alpha = 0;
      } else if (this.leaving) {
        this.growth -= dt * 0.4;
        if (this.growth <= 0) this.alpha = 0;
      } else {
        this.growth = Math.min(1, this.growth + dt * 0.3);
        this.alpha = Math.min(1, this.alpha + dt * 2);
        this.nervous = nervous;
      }
      return;
    }
    if (this.fleeing) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.alpha -= dt * 0.7;
      return;
    }
    if (this.collecting) {
      // Fly into the jar
      const [tx, ty] = slotCenter(this.rare.id);
      this.x += (tx - this.x) * Math.min(1, dt * 2.5);
      this.y += (ty - this.y) * Math.min(1, dt * 2.5);
      if (Math.hypot(tx - this.x, ty - this.y) < 12) {
        this.done = true;
        addToJar(this.rare);
      }
      return;
    }
    if (this.leaving) {
      this.vx += (this.leaveDir * 180 - this.vx) * dt * 2;
      this.vy *= 0.98;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      return;
    }
    this.alpha = Math.min(1, this.alpha + dt * 0.6);
    this.nervous = nervous;
    // Gentle wandering around a home spot; jittery when it's getting noisy
    const tx = this.homeX + Math.sin(t * 0.5 + this.phase) * 40;
    const ty = this.homeY + Math.cos(t * 0.37 + this.phase) * 25;
    this.vx += ((tx - this.x) * 0.8 + (Math.random() - 0.5) * nervous * 900) * dt;
    this.vy += ((ty - this.y) * 0.8 + (Math.random() - 0.5) * nervous * 900) * dt;
    this.vx *= 0.96; this.vy *= 0.96;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
  get gone() {
    return this.done || this.alpha <= 0 && (this.fleeing || this.leaving) || this.x < -150 || this.x > W + 150 || this.y < -150;
  }
  color(t) {
    return this.baseColor || rainbow(t);
  }
  pulse(t) {
    // Rare fireflies glow steadily so they stand out
    return this.rare ? 0.8 + 0.2 * Math.sin(t * 3 + this.phase) : 0.55 + 0.45 * Math.sin(t * this.blink + this.phase);
  }
  // Soft light around a firefly's tail (drawn with 'lighter' blending)
  drawGlow(t) {
    const s = this.size;
    const gx = this.x - this.dir * s * 0.95, gy = this.y + s * 0.35;
    const glow = this.pulse(t) * Math.max(0, this.alpha);
    const c = this.color(t);
    const r = s * (this.rare ? 5 : 4);
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
    grad.addColorStop(0, `rgba(255,255,230,${glow})`);
    grad.addColorStop(0.2, rgb(c, glow * 0.6));
    grad.addColorStop(1, rgb(c, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(gx, gy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  drawBody(t, mood) {
    if (Math.abs(this.vx) > 5) this.dir = this.vx < 0 ? -1 : 1;
    // Sad during the yellow warning; worried when it's just getting close to the line
    this.mood = mood || (this.fleeing ? 'scared' : warnProgress > 0 ? 'sad' : this.nervous > 0.4 ? 'worried' : 'happy');
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
    ctx.translate(this.x, this.y);
    if (this.plant && !this.collecting) {
      this.drawPlant(t);
    } else {
      ctx.scale(this.dir, 1);
      DRAW[this.kind](this.size, t, this.color(t), this);
    }
    ctx.restore();
    if (this.rare && !this.fleeing) {
      const atBloom = this.plant && !this.collecting;
      drawSparkles(atBloom ? this.bloomX : this.x, atBloom ? this.bloomY : this.y, this.size, t);
    }
  }
  // Stem and leaves, then the bloom on top; droops when sad
  drawPlant(t) {
    const s = this.size;
    const g = this.growth * this.growth * (3 - 2 * this.growth);
    const droop = this.mood === 'sad' ? 0.6 : this.mood === 'worried' ? 0.25 : 0;
    const sway = Math.sin(t * 1.5 + this.phase) * 0.08 + (Math.random() - 0.5) * this.nervous * 0.1;
    const h = this.stemH * g;
    const tx = Math.sin(sway) * h * 0.4 + droop * s * 1.6, ty = -h + droop * s;

    ctx.strokeStyle = '#4f9a3e';
    ctx.lineWidth = Math.max(3, s * 0.18);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(0, -h * 0.5, tx, ty);
    ctx.stroke();

    // Leaves partway up the stem
    const u = 0.35;
    const lx = 2 * (1 - u) * u * 0 + u * u * tx, ly = 2 * (1 - u) * u * (-h * 0.5) + u * u * ty;
    ctx.fillStyle = '#66bb55';
    [[-1, -0.6], [1, 0.6]].forEach(([side, rot]) => {
      ctx.beginPath();
      ctx.ellipse(lx + side * s * 0.5 * g, ly, s * 0.6 * g + 0.1, s * 0.22 * g + 0.1, rot, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.translate(tx, ty);
    ctx.rotate(sway + droop * 0.8);
    const b = Math.max(0.01, g);
    ctx.scale(b, b);
    DRAW[this.kind](s, t, this.color(t), this);
    this.bloomX = this.x + tx;
    this.bloomY = this.y + ty;
  }
}

let critters = [], lastSpawn = 0, lastRareCheck = 0, lastRotate = 0, lastFrame = performance.now();

// Only one rare at a time; longer quiet unlocks rarer kinds
function maybeSpawnRare(streak) {
  if (critters.some(c => c.rare && !c.fleeing && !c.done)) return;
  const unlocked = scene.rares.filter(r => streak >= r.quietSec * 1000);
  if (!unlocked.length || Math.random() > RARE_CHANCE) return;
  let roll = Math.random() * unlocked.reduce((sum, r) => sum + r.weight, 0);
  const choice = unlocked.find(r => (roll -= r.weight) < 0) || unlocked[0];
  critters.push(new Critter(choice, choice));
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  const t = now / 1000;

  if (analyser) {
    readLevel();
    updateState(now);
  }
  updateTimer(now);

  // New critters arrive while it stays quiet
  const max = scene.max || MAX_CRITTERS;
  const staying = critters.filter(c => !c.fleeing && !c.leaving).length;
  if (analyser && !loud && now - lastScare > 2000 && now - lastSpawn > 1200 && staying < max) {
    critters.push(new Critter(scene.common()));
    lastSpawn = now;
  }
  // Once the screen is full, a couple leave every few seconds so new ones can come in
  if (analyser && !loud && staying >= max && now - lastRotate > ROTATE_MS) {
    lastRotate = now;
    const settled = critters.filter(c => c.settled);
    for (let i = 0; i < ROTATE_COUNT && settled.length; i++) {
      settled.splice(Math.floor(Math.random() * settled.length), 1)[0].leave();
    }
  }
  if (analyser && !loud) {
    critters.forEach(c => { if (c.settled && now - c.born > c.life) c.leave(); });
  }
  if (analyser && !loud && now - lastRareCheck > RARE_CHECK_MS) {
    lastRareCheck = now;
    maybeSpawnRare(now - quietStart);
  }
  critters.forEach(c => {
    if (c.rare && !c.fleeing && !c.collecting && now - c.born > RARE_CATCH_MS) c.collect();
  });

  // Critters get more and more worried as the warning time runs out
  const nervous = warnProgress > 0 ? 0.6 + 0.4 * warnProgress : Math.max(0, Math.min(1, (level - (threshold - 12)) / 12));
  critters.forEach(c => c.update(dt, t, loud ? 0 : nervous));
  critters = critters.filter(c => !c.gone);

  // Skip drawing while the window has no size (e.g. opened in a background tab)
  if (!background.width || !background.height) {
    requestAnimationFrame(loop);
    return;
  }
  ctx.drawImage(background, 0, 0, W, H);
  if (scene.ambient) scene.ambient(t);
  if (scene.glow) {
    ctx.globalCompositeOperation = 'lighter';
    critters.forEach(c => c.drawGlow(t));
    ctx.globalCompositeOperation = 'source-over';
  }
  // Flowers planted nearer the front draw on top
  const order = scene.grow ? [...critters].sort((a, b) => a.homeY - b.homeY) : critters;
  order.forEach(c => c.drawBody(t));

  requestAnimationFrame(loop);
}

// ---- Gallery: click a caught rare in the jar to see it up close ----
const galleryCanvas = $('galleryCanvas');
let galleryCtx, galleryCritter = null;

$('slots').addEventListener('click', e => {
  const slot = e.target.closest('.slot.caught');
  if (slot) openGallery(slot.dataset.id);
});

function openGallery(id) {
  const rare = scene.rares.find(r => r.id === id);
  $('galleryName').textContent = rare.name;
  $('galleryCount').textContent = `${CLASSES.find(c => c.id === classId).name} caught ×${jar[id] || 0}`;
  $('galleryFact').textContent = rare.fact;
  $('gallery').hidden = false;

  const box = galleryCanvas.getBoundingClientRect();
  galleryCanvas.width = box.width * dpr;
  galleryCanvas.height = box.height * dpr;
  galleryCtx = galleryCanvas.getContext('2d');
  galleryCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  galleryCritter = new Critter(rare, rare);
  Object.assign(galleryCritter, {
    plant: false, alpha: 1, dir: 1, vx: 0,
    x: box.width / 2, y: box.height / 2,
    size: Math.min(box.width, box.height) * 0.17,
  });
  requestAnimationFrame(drawGallery);
}

function closeGallery() {
  $('gallery').hidden = true;
  galleryCritter = null;
}
$('galleryClose').addEventListener('click', closeGallery);
$('gallery').addEventListener('click', e => { if (e.target.id === 'gallery') closeGallery(); });
// ---- Clean display mode ----
function toggleClean() {
  const clean = document.body.classList.toggle('clean');
  document.body.classList.remove('peek');
  $('hideBtn').textContent = clean ? 'Show controls' : 'Hide controls';
}
$('hideBtn').addEventListener('click', toggleClean);

// Moving the mouse near the top peeks the controls back for a few seconds
let peekTimer;
document.addEventListener('mousemove', e => {
  if (!document.body.classList.contains('clean')) return;
  const peeking = document.body.classList.contains('peek');
  const reach = peeking ? $('controls').getBoundingClientRect().bottom + 30 : 60;
  if (e.clientY > reach) return;
  document.body.classList.add('peek');
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => document.body.classList.remove('peek'), 3000);
});

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeGallery(); closeReport(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'SELECT') return;
  const key = e.key.toLowerCase();
  if (key === 'h') toggleClean();
  else if (key === 'f') toggleFullscreen();
  else if (key === 'm') {
    alertSound = alertSound === 'off' ? lastSound : 'off';
    alertPick.value = alertSound;
    save();
    showToast(alertSound === 'off' ? '🔇 Alert sound off' : '🔊 Alert sound on');
  } else if (['1', '2', '3'].includes(key)) {
    activity = Object.keys(ACTIVITIES)[+key - 1];
    save();
    applyActivity();
    showToast(ACTIVITIES[activity].label);
  }
});

// ---- Session report ----
const reportCanvas = $('reportCanvas');

$('reportBtn').addEventListener('click', openReport);
$('reportClose').addEventListener('click', closeReport);
$('report').addEventListener('click', e => { if (e.target.id === 'report') closeReport(); });

function closeReport() {
  $('report').hidden = true;
}

function openReport() {
  $('report').hidden = false;
  const className = CLASSES.find(c => c.id === classId).name;
  const samples = session ? session.samples : [];
  const length = session ? performance.now() - session.start : 0;
  const quiet = samples.filter(s => !s.loud).length;
  $('reportSub').textContent = session
    ? `${className} · ${scene.name} · started ${new Date(Date.now() - length).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
    : 'Press Start to begin a session.';
  const tiles = [
    [fmt(length), 'Session length'],
    [samples.length ? Math.round(quiet / samples.length * 100) + '%' : '–', 'Time below the limit'],
    [fmt(best), 'Longest quiet streak'],
    [session ? session.scatters : 0, 'Times it got too loud'],
    [session ? session.caught : 0, 'Rares caught'],
  ];
  $('reportStats').innerHTML = tiles.map(([v, label]) => `<div class="tile"><b>${v}</b><span>${label}</span></div>`).join('');
  drawReportChart(samples);
}

// Noise level over the session, with the limit line and too-loud times shaded red
function drawReportChart(samples) {
  const box = reportCanvas.getBoundingClientRect();
  reportCanvas.width = box.width * dpr;
  reportCanvas.height = box.height * dpr;
  const g = reportCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = box.width, h = box.height, padL = 34, padR = 10, padT = 12, padB = 26;
  const pw = w - padL - padR, ph = h - padT - padB;
  g.clearRect(0, 0, w, h);
  g.font = '12px "Segoe UI", sans-serif';
  g.fillStyle = 'rgba(255,255,255,0.6)';

  if (samples.length < 2) {
    g.textAlign = 'center';
    g.fillText('The graph fills in as the session goes.', w / 2, h / 2);
    return;
  }
  const total = samples[samples.length - 1].t;
  const xOf = t => padL + t / total * pw;
  const yOf = v => padT + (1 - (v - MIN_DB) / (MAX_DB - MIN_DB)) * ph;

  // Gridlines with level labels
  g.strokeStyle = 'rgba(255,255,255,0.08)';
  g.textAlign = 'right';
  for (let v = 40; v <= 100; v += 20) {
    g.beginPath(); g.moveTo(padL, yOf(v)); g.lineTo(w - padR, yOf(v)); g.stroke();
    g.fillText(v, padL - 6, yOf(v) + 4);
  }

  // Shade warning (yellow) and too-loud (red) stretches
  const step = pw / samples.length + 1;
  samples.forEach(s => {
    if (!s.loud && !s.warn) return;
    g.fillStyle = s.loud ? 'rgba(255,77,77,0.3)' : 'rgba(255,200,40,0.2)';
    g.fillRect(xOf(s.t), padT, step, ph);
  });

  // Limit line (it can change mid-session)
  g.strokeStyle = '#ff4d4d';
  g.setLineDash([5, 4]);
  g.lineWidth = 1.5;
  g.beginPath();
  samples.forEach((s, i) => i ? g.lineTo(xOf(s.t), yOf(s.threshold)) : g.moveTo(xOf(s.t), yOf(s.threshold)));
  g.stroke();
  g.setLineDash([]);

  // Noise level
  g.strokeStyle = '#6ee7a8';
  g.lineWidth = 2;
  g.beginPath();
  samples.forEach((s, i) => i ? g.lineTo(xOf(s.t), yOf(s.level)) : g.moveTo(xOf(s.t), yOf(s.level)));
  g.stroke();

  // Time labels
  g.fillStyle = 'rgba(255,255,255,0.6)';
  [[0, 'left'], [0.5, 'center'], [1, 'right']].forEach(([f, align]) => {
    g.textAlign = align;
    g.fillText(fmt(total * f), padL + f * pw, h - 8);
  });
}

function drawGallery(now) {
  if (!galleryCritter) return;
  const t = now / 1000;
  const gw = galleryCanvas.width / dpr, gh = galleryCanvas.height / dpr;
  const mainCtx = ctx;
  ctx = galleryCtx;

  // A slice of the scene's background behind the critter
  const cw = W * 0.35, ch = cw * gh / gw;
  const cx = (W - cw) / 2, cy = Math.max(0, Math.min(H - ch, H * 0.5 - ch / 2));
  if (background.width) ctx.drawImage(background, cx * dpr, cy * dpr, cw * dpr, ch * dpr, 0, 0, gw, gh);

  galleryCritter.y = gh / 2 + Math.sin(t * 2) * 6;
  if (scene.glow) {
    ctx.globalCompositeOperation = 'lighter';
    galleryCritter.drawGlow(t);
    ctx.globalCompositeOperation = 'source-over';
  }
  galleryCritter.drawBody(t, 'happy');

  ctx = mainCtx;
  requestAnimationFrame(drawGallery);
}

window.addEventListener('resize', resize);
resize();
applyActivity();
applyScene();
requestAnimationFrame(loop);
</script>
