<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Critters Noise Monitor</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1530; color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Controls (above the start screen so the scene can be picked before starting) */
  #controls {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
    padding: 10px 16px; border-radius: 14px;
    background: rgba(10, 20, 45, 0.6); backdrop-filter: blur(6px);
    font-size: 16px; z-index: 11;
  }
  #controls .group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #threshold, #warnTime { width: 220px; accent-color: #ffd84d; }
  #warnTime { width: 150px; }
  /* Fixed-width numbers so the controls don't shift when a value gains a digit */
  #thresholdVal, #warnTimeVal {
    display: inline-block; min-width: 3ch; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #controls button {
    font: inherit; color: #0b1530; background: #ffd84d; border: 0;
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
  }
  #controls { transition: opacity 0.3s, transform 0.3s; }
  #controls button:disabled { opacity: 0.5; cursor: default; }
  #volume { width: 90px; accent-color: #ffd84d; }

  /* Clean display mode: controls hidden until the mouse nears the top or H is pressed */
  body.clean #controls { opacity: 0; pointer-events: none; transform: translateY(-20px); }
  body.clean.peek #controls { opacity: 1; pointer-events: auto; transform: none; }
  #peekTab {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 11;
    padding: 4px 14px; border-radius: 0 0 10px 10px; font-size: 13px;
    background: rgba(10, 20, 45, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  body.clean #peekTab { opacity: 0.5; }
  body.clean.peek #peekTab { opacity: 0; }

  #scenePick, #classPick, #alertPick, #timerPick {
    font: inherit; color: #0b1530; background: #fff; border: 0;
    padding: 5px 8px; border-radius: 8px; cursor: pointer;
  }
  #activityBtns { gap: 6px; }
  #activityBtns button { background: rgba(255,255,255,0.15); color: #fff; }
  #activityBtns button.active { background: #ffd84d; color: #0b1530; font-weight: 700; }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: #ffd84d; }
  .hint { opacity: 0.7; font-size: 13px; }

  /* Level meter */
  #meter {
    position: fixed; right: 20px; top: 50%; transform: translateY(-40%);
    width: 34px; height: 50vh; border-radius: 17px;
    background: rgba(255,255,255,0.12); overflow: visible; z-index: 4;
  }
  #meterFill {
    position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
    border-radius: 17px; background: #6ee7a8;
    transition: background 0.3s;
  }
  #meterMark {
    position: absolute; left: -8px; right: -8px; height: 4px;
    background: #ff4d4d; border-radius: 2px; box-shadow: 0 0 6px #ff4d4d;
  }
  #dbReadout {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 8px; white-space: nowrap; font-weight: 600;
  }

  /* Quiet-time stats */
  #stats {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px;
    background: rgba(10, 20, 45, 0.6); font-size: clamp(18px, 3vw, 30px);
    white-space: nowrap; z-index: 4;
  }
  #stats b { color: #ffd84d; font-variant-numeric: tabular-nums; }

  /* Warning glow while over the line, before the critters scatter */
  #warnEdge {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    box-shadow: inset 0 0 80px 30px rgba(255, 200, 40, 0.75);
    opacity: 0; transition: opacity 0.3s;
  }
  body.warning #warnEdge { opacity: 1; animation: warnPulse 0.8s ease-in-out infinite; }
  @keyframes warnPulse { 50% { box-shadow: inset 0 0 120px 50px rgba(255, 200, 40, 0.9); } }

  /* Too-loud overlay */
  #alarm {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(220, 20, 20, 0.78); opacity: 0; transition: opacity 0.3s;
  }
  #alarm div {
    font-size: clamp(48px, 12vw, 160px); font-weight: 800;
    text-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  body.loud #alarm { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { background: rgba(255, 50, 50, 0.9); } }

  /* Rare collection jar */
  #jar {
    position: fixed; left: 20px; top: 50%; transform: translateY(-40%);
    width: 200px; padding: 12px 14px; border-radius: 14px;
    background: rgba(10, 20, 45, 0.6); z-index: 4;
  }
  #jar h2 { margin: 0 0 8px; font-size: 18px; color: #ffd84d; }
  .slot { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; line-height: 1.2; }
  .dot {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); font-weight: 700;
  }
  .slot small { display: block; opacity: 0.7; font-size: 12px; }
  .slot.caught b { color: #fff; }
  .slot.caught { cursor: pointer; border-radius: 8px; margin: 4px -6px; padding: 4px 6px; }
  .slot.caught:hover { background: rgba(255,255,255,0.12); }

  /* Pop-up cards: rare gallery and session report */
  .modal {
    position: fixed; inset: 0; z-index: 12;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(5, 10, 25, 0.7);
  }
  .modal[hidden] { display: none; }
  .modal .card {
    position: relative; width: min(420px, 100%); max-height: 100%; overflow: auto;
    padding: 20px 22px 24px; border-radius: 20px; background: #14224a; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 { margin: 16px 0 4px; font-size: 26px; color: #ffd84d; }
  #galleryCanvas { width: 100%; height: 240px; border-radius: 14px; display: block; }
  #galleryCount, #reportSub { margin: 0 0 12px; opacity: 0.75; }
  #galleryFact { margin: 0; font-size: 18px; line-height: 1.45; }
  #report .card { width: min(760px, 100%); }
  #report h2 { margin-top: 4px; }
  #reportCanvas { width: 100%; height: 240px; border-radius: 12px; display: block; background: #0d1838; }
  #reportStats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px;
  }
  .tile { padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.08); }
  .tile b { display: block; font-size: 24px; color: #ffd84d; }
  .tile span { font-size: 13px; opacity: 0.8; }
  .closeBtn {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px;
    border: 0; border-radius: 50%; font-size: 16px; cursor: pointer;
    color: #fff; background: rgba(255,255,255,0.15);
  }
  #resetJar {
    margin-top: 4px; font: inherit; font-size: 12px; color: #fff; opacity: 0.6;
    background: none; border: 1px solid rgba(255,255,255,0.4); border-radius: 6px;
    padding: 2px 8px; cursor: pointer;
  }

  #toast {
    position: fixed; left: 50%; top: 90px; transform: translateX(-50%);
    padding: 12px 26px; border-radius: 999px; z-index: 5;
    background: rgba(10, 20, 45, 0.85); font-size: clamp(18px, 3vw, 28px); font-weight: 700;
    opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* Start screen */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 20px; text-align: center; background: rgba(11, 21, 48, 0.92);
  }
  #start h1 { margin: 0; font-size: clamp(32px, 6vw, 60px); color: #ffd84d; }
  #start p { margin: 0; max-width: 560px; font-size: 18px; line-height: 1.5; opacity: 0.9; }
  #startBtn {
    font: inherit; font-size: 24px; font-weight: 700; color: #0b1530;
    background: #ffd84d; border: 0; padding: 14px 36px; border-radius: 14px; cursor: pointer;
  }
  #error { color: #ff9b9b; max-width: 560px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header id="controls">
  <div class="group">
    <label for="scenePick">Scene:</label>
    <select id="scenePick"></select>
  </div>
  <div class="group">
    <label for="classPick">Class:</label>
    <select id="classPick"></select>
  </div>
  <div class="group" id="activityBtns">
    <span>Activity:</span>
  </div>
  <div class="group">
    <label for="threshold">Noise limit: <b id="thresholdVal">70</b></label>
    <input type="range" id="threshold" min="40" max="100" step="1" value="70">
    <span class="hint" title="Numbers are a relative noise level from your microphone, not calibrated decibels. They vary between devices.">(lower = more sensitive · relative scale, not decibels)</span>
  </div>
  <div class="group">
    <label for="warnTime">Warning time: <b id="warnTimeVal">3</b> sec</label>
    <input type="range" id="warnTime" min="0.5" max="10" step="0.5" value="3">
  </div>
  <div class="group">
    <label for="alertPick">Alert:</label>
    <select id="alertPick">
      <option value="beep">Beep</option>
      <option value="chime">Chime</option>
      <option value="shh">Shhh</option>
      <option value="off">Off (visual only)</option>
    </select>
    <input type="range" id="volume" min="0" max="100" step="5" value="70" title="Alert volume" aria-label="Alert volume">
  </div>
  <div class="group">
    <label for="timerPick">Timer:</label>
    <select id="timerPick">
      <option value="0">Off</option>
      <option value="1">1 min</option>
      <option value="2">2 min</option>
      <option value="3">3 min</option>
      <option value="5">5 min</option>
      <option value="10">10 min</option>
      <option value="15">15 min</option>
      <option value="20">20 min</option>
      <option value="30">30 min</option>
      <option value="45">45 min</option>
      <option value="60">60 min</option>
    </select>
  </div>
  <button id="reportBtn">📈 Report</button>
  <button id="hideBtn">Hide controls</button>
  <button id="fsBtn">Fullscreen</button>
  <span class="hint">Keys: H hide · F fullscreen · 1–3 activity · M sound</span>
</header>
<div id="peekTab">Move the mouse here or press H for controls</div>

<div id="meter"><div id="meterFill"></div><div id="meterMark"></div><span id="dbReadout">--</span></div>
<div id="stats"><span id="timerLabel" hidden>⏱ <b id="timerVal">0:00</b> &nbsp;·&nbsp; </span><span id="activityLabel"></span> &nbsp;·&nbsp; Quiet time <b id="streak">0:00</b> &nbsp;·&nbsp; Best <b id="best">0:00</b></div>
<div id="jar"><h2 id="jarTitle"></h2><div id="slots"></div><button id="resetJar">Empty jar</button></div>
<div id="toast"></div>
<div id="warnEdge"></div>
<div id="alarm"><div>Too loud!</div></div>

<div id="report" class="modal" hidden>
  <div class="card">
    <button class="closeBtn" id="reportClose" aria-label="Close">✕</button>
    <h2>Session Report</h2>
    <p id="reportSub"></p>
    <canvas id="reportCanvas"></canvas>
    <div id="reportStats"></div>
  </div>
</div>

<div id="gallery" class="modal" hidden>
  <div class="card">
    <button class="closeBtn" id="galleryClose" aria-label="Close">✕</button>
    <canvas id="galleryCanvas"></canvas>
    <h2 id="galleryName"></h2>
    <p id="galleryCount"></p>
    <p id="galleryFact"></p>
  </div>
</div>

<div id="start">
  <h1 id="startTitle"></h1>
  <p id="startIntro"></p>
  <p id="startRares"></p>
  <button id="startBtn">Start</button>
  <p id="error"></p>
</div>

<script>
// ---- Settings ----
const MIN_DB = 30, MAX_DB = 110;   // meter range
const DB_OFFSET = 100;             // shifts mic level (dBFS) onto a friendly 30–110 scale; not real room dB, so the page never says "dB"
const MAX_CRITTERS = 40;
const QUIET_AFTER_MS = 1500;       // must stay under the limit this long to clear
const BEEP_EVERY_MS = 3000;
const RARE_CATCH_MS = 15000;       // a rare critter is caught after staying this long
const RARE_CHECK_MS = 8000;        // how often to roll for a rare critter
const RARE_CHANCE = 0.4;
const ROTATE_MS = 4000;            // once the screen is full, swap a couple of critters this often
const ROTATE_COUNT = 2;
const LIFE_MIN_MS = 20000;         // regular critters also leave on their own after 20–45 seconds,
const LIFE_RANGE_MS = 25000;       // so there's always some coming and going

const $ = id => document.getElementById(id);
const canvas = $('scene');
let ctx = canvas.getContext('2d');   // swapped to the gallery canvas while drawing a gallery card
const slider = $('threshold'), warnSlider = $('warnTime');
const alertPick = $('alertPick'), volumeSlider = $('volume');

const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, d, f) => c.map((v, i) => Math.round(v + (d[i] - v) * f));
const WHITE = [255, 255, 255], BLACK = [0, 0, 0];
const pick = list => list[Math.floor(Math.random() * list.length)];

function addToJar(rare) {

let toastTimer;

  toastTimer = setTimeout(() => $('toast').classList.remove('show'), ms);

function slotCenter(id) {

// ---- Audio ----
let audioCtx, analyser, buf;
let level = MIN_DB;

$('startBtn').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    $('start').style.display = 'none';
    quietStart = performance.now();
    newSession();
  } catch (e) {
    const embedded = window.self !== window.top;
    $('error').textContent = embedded
      ? 'The microphone is blocked because this page is embedded inside another page. Open the noise monitor in its own browser tab instead.'
      : 'Microphone access was blocked. Allow the microphone (click the icon in the address bar) and try again.';
  }
});

function readLevel() {
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length);
  const db = Math.max(MIN_DB, Math.min(MAX_DB, 20 * Math.log10(rms || 1e-8) + DB_OFFSET));
  // Rises fast, falls slowly so the meter is readable
  level += (db - level) * (db > level ? 0.3 : 0.05);
}

function tones(notes, type, peak, length, gap) {
  const t = audioCtx.currentTime;
  peak = Math.max(0.0002, peak * volume / 100);
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const start = t + i * gap;
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + length);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + length + 0.05);
  });
}
const chime = () => tones([660, 880, 1320], 'sine', 0.25, 0.4, 0.12);

// A soft "shhh": filtered noise that swells and fades
function shush() {
  const t = audioCtx.currentTime, len = 1.0;
  const noise = audioCtx.createBuffer(1, audioCtx.sampleRate * len, audioCtx.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(), filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();
  src.buffer = noise;
  filter.type = 'bandpass';
  filter.frequency.value = 3500;
  filter.Q.value = 0.8;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.8 * volume / 100), t + 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
}

const ALERTS = {
  beep: () => tones([880, 660], 'triangle', 0.4, 0.22, 0.25),
  chime: () => tones([1046, 784, 523], 'sine', 0.35, 0.6, 0.18),
  shh: shush,
};
function playAlert() {
  if (alertSound !== 'off' && audioCtx) ALERTS[alertSound]();
}

// ---- Loud / quiet state ----
let loud = false, overSince = null, underSince = null, lastBeep = 0;
let quietStart = performance.now(), best = 0, lastScare = -Infinity;
let warnProgress = 0;              // 0..1 through the warning time

// ---- Session (since Start or since switching class): feeds the report ----
let session = null;
function newSession() {
  session = { start: performance.now(), samples: [], lastSample: -Infinity, scatters: 0, caught: 0 };
}
function recordSample(now) {
  if (!session || now - session.lastSample < 1000) return;
  session.lastSample = now;
  session.samples.push({ t: now - session.start, level, threshold, loud, warn: warnProgress > 0 });
}

// ---- Countdown timer ----
const timerPick = $('timerPick');
let timerEnd = 0, timerScatters = 0;

timerPick.addEventListener('change', () => {
  const mins = +timerPick.value;
  timerEnd = mins ? performance.now() + mins * 60000 : 0;
  timerScatters = 0;
  $('timerLabel').hidden = !timerEnd;
  timerPick.blur();
});

function updateTimer(now) {
  if (!timerEnd) return;
  const left = timerEnd - now;
  $('timerVal').textContent = fmt(Math.max(0, left) + 999);
  if (left > 0) return;
  timerEnd = 0;
  timerPick.value = '0';
  $('timerLabel').hidden = true;
  if (alertSound !== 'off' && audioCtx) tones([523, 659, 784, 1046], 'sine', 0.3, 0.5, 0.15);
  showToast(timerScatters ? "⏰ Time's up!" : "🎉 Time's up! Your class stayed calm the whole time!", 6000);
}

function updateState(now) {
  warnProgress = 0;
  if (level > threshold) {
    underSince = null;
    if (overSince === null) overSince = now;
    if (!loud) warnProgress = Math.min(1, (now - overSince) / (warnSec * 1000));
    if (!loud && now - overSince > warnSec * 1000) {
      loud = true;
      lastScare = now;
      if (session) session.scatters++;
      timerScatters++;
      document.body.classList.add('loud');
      critters.forEach(c => c.scare(W / 2, H / 2));
    }
  } else {
    overSince = null;
    if (underSince === null) underSince = now;
    if (loud && now - underSince > QUIET_AFTER_MS) {
      loud = false;
      quietStart = now;
      document.body.classList.remove('loud');
    }
  }
  document.body.classList.toggle('warning', warnProgress > 0);
  if (loud && now - lastBeep > BEEP_EVERY_MS) { playAlert(); lastBeep = now; }
  recordSample(now);

  const streak = loud ? 0 : now - quietStart;
  if (loud) quietStart = now;
  best = Math.max(best, streak);
  $('streak').textContent = fmt(streak);
  $('best').textContent = fmt(best);

  $('meterFill').style.height = pct(level) + '%';
  $('meterFill').style.background = level > threshold ? '#ff4d4d' : level > threshold - 10 ? '#ffc94d' : '#6ee7a8';
  $('dbReadout').textContent = Math.round(level);
}

const fmt = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---- Backgrounds ----
let W = 0, H = 0, dpr = 1, background;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  background = drawBackground();
}

function drawBackground() {
  const bg = document.createElement('canvas');
  bg.width = W * dpr; bg.height = H * dpr;
  const g = bg.getContext('2d');
  g.scale(dpr, dpr);
  // Seeded so scenery doesn't jump around on resize
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  scene.background(g, rand);
  return bg;
}

function drawMeadow(g, rand) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060c22');
  sky.addColorStop(0.6, '#16295a');
  sky.addColorStop(1, '#22406b');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  for (let i = 0; i < 160; i++) {
    g.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.6})`;
    g.beginPath();
    g.arc(rand() * W, rand() * H * 0.6, rand() * 1.4 + 0.3, 0, Math.PI * 2);
    g.fill();
  }

  // Moon
  const mx = W * 0.18, my = H * 0.24, mr = Math.min(W, H) * 0.07;
  const glow = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3);
  glow.addColorStop(0, 'rgba(255,250,220,0.25)');
  glow.addColorStop(1, 'rgba(255,250,220,0)');
  g.fillStyle = glow;
  g.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  g.fillStyle = '#fdf6d8';
  g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();

  hill(g, H * 0.72, '#14284a', 0.08, 1.3);
  hill(g, H * 0.82, '#0d1d38', 0.05, 2.1);

  // Grass blades
  g.strokeStyle = '#0a1830';
  g.lineWidth = 2;
  for (let x = 0; x < W; x += 4) {
    const h = 15 + rand() * 35, lean = (rand() - 0.5) * 20;
    g.beginPath();
    g.moveTo(x, H);
    g.quadraticCurveTo(x + lean * 0.3, H - h * 0.6, x + lean, H - h);
    g.stroke();
  }
}

function hill(g, baseY, color, amp, freq) {
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(0, H);
  for (let x = 0; x <= W; x += 10) {
    g.lineTo(x, baseY + Math.sin(x / W * Math.PI * freq) * H * amp);
  }
  g.lineTo(W, H);
  g.fill();
}

function drawAquarium(g, rand) {
  const water = g.createLinearGradient(0, 0, 0, H);
  water.addColorStop(0, '#3cc6d8');
  water.addColorStop(0.5, '#167fae');
  water.addColorStop(1, '#0b4a7a');
  g.fillStyle = water;
  g.fillRect(0, 0, W, H);

  // Sunbeams from the surface
  g.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.2);
    g.beginPath();
    g.moveTo(x - 30, 0); g.lineTo(x + 40, 0);
    g.lineTo(x + 160, H * 0.9); g.lineTo(x - 20, H * 0.9);
    g.fill();
  }

  // Sandy floor
  const sandY = H * 0.9;
  g.fillStyle = '#e9d6a0';
  g.beginPath();
  g.moveTo(0, H);
  for (let x = 0; x <= W; x += 10) g.lineTo(x, sandY + Math.sin(x / W * Math.PI * 3) * 10);
  g.lineTo(W, H);
  g.fill();
  g.fillStyle = 'rgba(160,130,80,0.5)';
  for (let i = 0; i < 120; i++) {
    g.beginPath();
    g.arc(rand() * W, sandY + 12 + rand() * H * 0.1, rand() * 2 + 0.5, 0, Math.PI * 2);
    g.fill();
  }

  // Rocks and coral
  [[0.08, 34, 22], [0.3, 26, 16], [0.7, 40, 24], [0.93, 28, 18]].forEach(([fx, rx, ry]) => {
    g.fillStyle = '#6f8596';
    g.beginPath();
    g.ellipse(W * fx, sandY + 6, rx, ry, 0, Math.PI, 0);
    g.fill();
  });
  [[0.18, '#ff7f8f'], [0.5, '#ffa64d'], [0.82, '#c77dff']].forEach(([fx, color]) => {
    coral(g, W * fx, sandY + 4, color, Math.min(W, H) / 700, rand);
  });
}

function coral(g, x, y, color, scale, rand) {
  g.strokeStyle = color;
  g.lineCap = 'round';
  const branch = (bx, by, angle, len, width) => {
    if (len < 8) return;
    const ex = bx + Math.cos(angle) * len, ey = by + Math.sin(angle) * len;
    g.lineWidth = width;
    g.beginPath(); g.moveTo(bx, by); g.lineTo(ex, ey); g.stroke();
    branch(ex, ey, angle - 0.45 - rand() * 0.2, len * 0.7, width * 0.75);
    branch(ex, ey, angle + 0.45 + rand() * 0.2, len * 0.7, width * 0.75);
  };
  branch(x, y, -Math.PI / 2, 45 * scale + 20, 12 * scale + 4);
}

// Swaying seaweed and rising bubbles, drawn every frame behind the critters
function aquariumAmbient(t) {
  ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const x = W * (0.05 + i * 0.115) + (i % 2) * 20;
    const h = H * (0.16 + ((i * 37) % 10) / 60);
    ctx.strokeStyle = i % 2 ? '#2f9e6a' : '#3cb371';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(x, H * 0.92);
    for (let j = 1; j <= 8; j++) {
      ctx.lineTo(x + Math.sin(t * 1.2 + i + j * 0.6) * j * 2.5, H * 0.92 - h * j / 8);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 24; i++) {
    const x = (i * 173.3) % W + Math.sin(t * 2 + i) * 6;
    const y = H - ((t * (30 + (i % 5) * 10) + i * 211) % (H + 40));
    ctx.beginPath();
    ctx.arc(x, y, 3 + (i % 4) * 2, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawHalloween(g, rand) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#140a2a');
  sky.addColorStop(0.6, '#34195a');
  sky.addColorStop(1, '#5b2b6e');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  for (let i = 0; i < 100; i++) {
    g.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.5})`;
    g.beginPath();
    g.arc(rand() * W, rand() * H * 0.55, rand() * 1.3 + 0.3, 0, Math.PI * 2);
    g.fill();
  }

  // Big orange moon with a few bats flying past
  const sc = Math.min(W, H) / 700;
  const mx = W * 0.78, my = H * 0.24, mr = Math.min(W, H) * 0.09;
  const glow = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3);
  glow.addColorStop(0, 'rgba(255,190,90,0.3)');
  glow.addColorStop(1, 'rgba(255,190,90,0)');
  g.fillStyle = glow;
  g.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  g.fillStyle = '#ffcf73';
  g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(230,160,60,0.35)';
  [[-0.3, -0.2, 0.18], [0.35, 0.1, 0.13], [-0.05, 0.4, 0.1]].forEach(([x, y, r]) => {
    g.beginPath(); g.arc(mx + x * mr, my + y * mr, r * mr, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = '#1a0e2a';
  [[-0.6, -0.5, 1], [0.2, -0.75, 0.8], [0.7, -0.1, 0.9]].forEach(([x, y, k]) => {
    const bx = mx + x * mr, by = my + y * mr, w = 14 * sc * k;
    g.beginPath();
    g.moveTo(bx - w, by);
    g.quadraticCurveTo(bx - w / 2, by - w * 0.6, bx, by);
    g.quadraticCurveTo(bx + w / 2, by - w * 0.6, bx + w, by);
    g.quadraticCurveTo(bx + w / 2, by - w * 0.15, bx, by + w * 0.25);
    g.quadraticCurveTo(bx - w / 2, by - w * 0.15, bx - w, by);
    g.fill();
  });

  hill(g, H * 0.74, '#24133d', 0.06, 1.6);
  hill(g, H * 0.87, '#170c27', 0.02, 3);

  // Crooked tree
  coral(g, W * 0.06, H * 0.9, '#120a1e', sc * 2.2, rand);

  // Gravestones
  const groundY = H * 0.89;
  [[0.22, 1], [0.4, 0.85], [0.62, 1.1], [0.88, 0.9]].forEach(([fx, k]) => {
    const w = 46 * sc * k, h = 62 * sc * k, x = W * fx;
    g.fillStyle = '#575170';
    g.strokeStyle = '#3c3752';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x - w / 2, groundY);
    g.lineTo(x - w / 2, groundY - h + w / 2);
    g.arc(x, groundY - h + w / 2, w / 2, Math.PI, 0);
    g.lineTo(x + w / 2, groundY);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#3c3752';
    g.font = `bold ${Math.round(13 * sc * k)}px sans-serif`;
    g.textAlign = 'center';
    g.fillText('RIP', x, groundY - h * 0.5);
  });

  // Glowing jack-o'-lanterns on the ground
  [[0.31, 1], [0.52, 0.8], [0.76, 1.1]].forEach(([fx, k]) => {
    const x = W * fx, r = 18 * sc * k, y = groundY - r * 0.8;
    const lg = g.createRadialGradient(x, y, r * 0.5, x, y, r * 3);
    lg.addColorStop(0, 'rgba(255,170,60,0.35)');
    lg.addColorStop(1, 'rgba(255,170,60,0)');
    g.fillStyle = lg;
    g.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
    g.fillStyle = '#e8741c';
    g.beginPath(); g.ellipse(x, y, r * 1.2, r, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#5c7a2e';
    g.fillRect(x - r * 0.1, y - r * 1.3, r * 0.2, r * 0.4);
    g.fillStyle = '#ffe066';
    [-0.45, 0.45].forEach(ex => {
      g.beginPath();
      g.moveTo(x + ex * r - r * 0.2, y - r * 0.1);
      g.lineTo(x + ex * r, y - r * 0.45);
      g.lineTo(x + ex * r + r * 0.2, y - r * 0.1);
      g.fill();
    });
    g.beginPath();
    g.moveTo(x - r * 0.55, y + r * 0.2);
    g.quadraticCurveTo(x, y + r * 0.75, x + r * 0.55, y + r * 0.2);
    g.quadraticCurveTo(x, y + r * 0.4, x - r * 0.55, y + r * 0.2);
    g.fill();
  });
}

function drawGarden(g, rand) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#7fcbff');
  sky.addColorStop(0.7, '#d4f1ff');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // Sun
  const sx = W * 0.82, sy = H * 0.2, sr = Math.min(W, H) * 0.08;
  const glow = g.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 3);
  glow.addColorStop(0, 'rgba(255,240,150,0.6)');
  glow.addColorStop(1, 'rgba(255,240,150,0)');
  g.fillStyle = glow;
  g.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
  g.fillStyle = '#ffe259';
  g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();

  hill(g, H * 0.62, '#9fd97a', 0.06, 1.4);
  hill(g, H * 0.7, '#7cc95e', 0.04, 2.2);

  // White picket fence
  const sc = Math.min(W, H) / 700;
  const fenceY = H * 0.74, ph = 50 * sc, pw = 16 * sc;
  g.fillStyle = '#fdfdf7';
  g.fillRect(0, fenceY - ph * 0.7, W, 6 * sc);
  g.fillRect(0, fenceY - ph * 0.3, W, 6 * sc);
  for (let x = 6; x < W; x += pw * 1.8) {
    g.beginPath();
    g.moveTo(x, fenceY);
    g.lineTo(x, fenceY - ph);
    g.lineTo(x + pw / 2, fenceY - ph - pw * 0.6);
    g.lineTo(x + pw, fenceY - ph);
    g.lineTo(x + pw, fenceY);
    g.fill();
  }

  // Lawn
  g.fillStyle = '#5fb84a';
  g.fillRect(0, fenceY, W, H - fenceY);

  // Soil bed where the flowers grow
  const bedY = H * 0.8;
  g.fillStyle = '#8b5a3c';
  g.beginPath();
  g.moveTo(0, H);
  for (let x = 0; x <= W; x += 10) g.lineTo(x, bedY + Math.sin(x / W * Math.PI * 4) * 6);
  g.lineTo(W, H);
  g.fill();
  g.fillStyle = 'rgba(60,35,20,0.4)';
  for (let i = 0; i < 160; i++) {
    g.beginPath();
    g.arc(rand() * W, bedY + 8 + rand() * H * 0.2, rand() * 2.5 + 0.5, 0, Math.PI * 2);
    g.fill();
  }

  // Grass tufts along the lawn
  g.strokeStyle = '#4a9c38';
  g.lineWidth = 2;
  for (let i = 0; i < 90; i++) {
    const x = rand() * W, y = fenceY + 6 + rand() * (bedY - fenceY - 8);
    g.beginPath();
    g.moveTo(x - 3, y); g.lineTo(x - 5, y - 8);
    g.moveTo(x, y); g.lineTo(x, y - 10);
    g.moveTo(x + 3, y); g.lineTo(x + 5, y - 8);
    g.stroke();
  }
}

function drawHarvest(g, rand) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#f7a35c');
  sky.addColorStop(0.45, '#ffd29a');
  sky.addColorStop(0.7, '#ffe8c2');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // Low golden sun
  const sx = W * 0.72, sy = H * 0.5, sr = Math.min(W, H) * 0.11;
  const glow = g.createRadialGradient(sx, sy, sr * 0.8, sx, sy, sr * 3.5);
  glow.addColorStop(0, 'rgba(255,240,180,0.7)');
  glow.addColorStop(1, 'rgba(255,240,180,0)');
  g.fillStyle = glow;
  g.fillRect(sx - sr * 3.5, sy - sr * 3.5, sr * 7, sr * 7);
  g.fillStyle = '#fff1b8';
  g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();

  hill(g, H * 0.62, '#d9a35b', 0.05, 1.5);
  hill(g, H * 0.7, '#c98a3f', 0.035, 2.4);

  // Red barn on the hill
  const sc = Math.min(W, H) / 700;
  const bx = W * 0.2, by = H * 0.68, bw = 110 * sc, bh = 80 * sc;
  g.fillStyle = '#b83a2e';
  g.fillRect(bx - bw / 2, by - bh, bw, bh);
  g.fillStyle = '#7a2a22';
  g.beginPath();
  g.moveTo(bx - bw * 0.6, by - bh);
  g.lineTo(bx, by - bh * 1.75);
  g.lineTo(bx + bw * 0.6, by - bh);
  g.fill();
  g.strokeStyle = '#fff';
  g.lineWidth = 3 * sc;
  const dw = bw * 0.36, dh = bh * 0.6;
  g.strokeRect(bx - dw / 2, by - dh, dw, dh);
  g.beginPath();
  g.moveTo(bx - dw / 2, by - dh); g.lineTo(bx + dw / 2, by);
  g.moveTo(bx + dw / 2, by - dh); g.lineTo(bx - dw / 2, by);
  g.stroke();
  g.fillStyle = '#fff6d8';
  g.fillRect(bx - bw * 0.1, by - bh * 1.38, bw * 0.2, bh * 0.22);

  // Field with crop rows
  const fieldY = H * 0.74;
  g.fillStyle = '#b9852f';
  g.fillRect(0, fieldY, W, H - fieldY);
  for (let i = 0, y = fieldY; y < H; i++) {
    const h = 6 + i * 3;
    g.fillStyle = i % 2 ? '#c99a45' : '#ab7a2c';
    g.fillRect(0, y, W, h);
    y += h;
  }

  // Round hay bales
  [[0.4, 1], [0.58, 0.8], [0.9, 1.1]].forEach(([fx, k]) => {
    const x = W * fx, r = 30 * sc * k, y = fieldY + r * 0.4;
    g.fillStyle = '#e0b552';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#c4973a';
    g.lineWidth = 2;
    for (let j = 1; j <= 3; j++) {
      g.beginPath(); g.arc(x, y, r * j / 4, 0, Math.PI * 1.6); g.stroke();
    }
  });

  // Corn stalks along the edges
  [[0.02, 0.1], [0.94, 1.0]].forEach(([f0, f1]) => {
    for (let i = 0; i < 4; i++) {
      const x = W * (f0 + (f1 - f0) * i / 3), h = H * (0.3 + rand() * 0.1);
      g.strokeStyle = '#a8862f';
      g.lineWidth = 5 * sc + 2;
      g.beginPath(); g.moveTo(x, H); g.lineTo(x, H - h); g.stroke();
      g.fillStyle = '#c9a646';
      for (let j = 1; j <= 4; j++) {
        const ly = H - h * j / 5, side = j % 2 ? 1 : -1;
        g.beginPath();
        g.moveTo(x, ly);
        g.quadraticCurveTo(x + side * 40 * sc, ly - 30 * sc, x + side * 60 * sc, ly + 5 * sc);
        g.quadraticCurveTo(x + side * 30 * sc, ly - 10 * sc, x, ly + 8 * sc);
        g.fill();
      }
    }
  });
}
